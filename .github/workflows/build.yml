name: Build Behavioral Tracker

# Builds a single-download app for Windows, macOS, and Linux -- each on
# its real OS (PyInstaller can't cross-build one OS's app from another).
# Trigger it two ways:
#   1. Actions tab -> this workflow -> "Run workflow" button (quick test)
#   2. Push a tag like v1.0 -> also publishes a GitHub Release with all
#      3 built apps attached as downloadable files.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk (Linux runner needs this explicitly)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: pyinstaller --onefile --name BehavioralTracker --add-data "resources:resources" --collect-all cv2 --collect-all matplotlib --collect-all scipy main.py

      - name: Zip the macOS app (so it's one downloadable file)
        if: runner.os == 'macOS'
        run: cd dist && zip -r BehavioralTracker-mac.zip BehavioralTracker.app

      - name: Mark Linux binary executable
        if: runner.os == 'Linux'
        run: chmod +x dist/BehavioralTracker

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BehavioralTracker-windows
          path: dist/BehavioralTracker.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: BehavioralTracker-mac
          path: dist/BehavioralTracker-mac.zip

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: BehavioralTracker-linux
          path: dist/BehavioralTracker

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      - name: Publish GitHub Release with all 3 apps attached
        uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
